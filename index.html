<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>點餐大師 - 模組化互動教具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #050505;
            color: #fff;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }

        .hide-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #555 #1a1a1a;
        }

        /* 欄位標題與箭頭 */
        .tab-header { text-align: center; font-weight: bold; padding: 0.4rem 0; font-size: 1.25rem; line-height: 1.75rem; position: relative; }
        .tab-arrow-r, .tab-arrow-l { position:absolute; top:0; width:0; height:0; border-top:1.275rem solid transparent; border-bottom:1.275rem solid transparent; border-left:1rem solid; z-index:20; }
        .tab-arrow-r { right:-1rem; }
        .tab-arrow-l { left:0; }

        /* 左欄訂單中的品項：不反白文字，改成整顆餐點被選取 */
        .order-items { user-select: none; -webkit-user-select: none; }
        .chip {
            display: inline-block;
            position: relative;
            margin: 3px 3px;
            padding: 0 7px;
            border-radius: 5px;
            border: 1px solid #4b5563;
            background: rgba(0, 0, 0, 0.5);
            color: #e5e7eb;
            font-size: 1.2rem;
            line-height: 1.75;
            white-space: nowrap;
            transition: background-color 0.1s, border-color 0.1s;
        }
        /* 可以拖曳建立套餐時 (第 1 關) */
        .can-define .chip { cursor: pointer; touch-action: none; }
        .can-define .chip.uncov:hover { border-color: #ed7d31; color: #fff; }
        .can-define .chip.cov { cursor: not-allowed; }
        /* 還沒有被任何套餐包含的品項：灰字 + 虛線框 */
        .chip.uncov { border-style: dashed; border-color: #6b7280; color: #9ca3af; }
        /* 第 1 關沒有套餐：餐點用一般實線框 */
        .plain .chip.uncov { border-style: solid; border-color: #4b5563; color: #e5e7eb; }
        /* 第 1 關：已經放對的餐點 (左右同步亮綠框)、放錯的餐點 (紅框) */
        .chip.got { border: 2px solid #22c55e !important; background: rgba(34, 197, 94, 0.2) !important; color: #fff !important; }
        .chip.bad { border: 2px solid #ef4444 !important; background: rgba(239, 68, 68, 0.25) !important; color: #fff !important; }
        /* 已被套餐包含的品項：橘色標示 */
        .chip.cov { background: rgba(234, 88, 12, 0.25); color: #fed7aa; border-color: rgba(234, 88, 12, 0.6); }
        /* 拖曳中被選取的餐點 */
        .chip.picking { background: #ed7d31; border: 1px solid #fdba74; color: #fff; }
        /* 選太多 (超過 3 個) 時變紅色 */
        .chip.picking.too-many { background: #b91c1c; border-color: #fca5a5; }

        /* 套餐：一個紅框包住它的品項，左上角一個代號 */
        .mod-group {
            display: inline-block;
            position: relative;
            margin: 14px 4px 3px 10px;
            padding: 1px 2px;
            border: 2px solid #dc2626;
            border-radius: 8px;
            background: rgba(220, 38, 38, 0.08);
            white-space: nowrap;
        }
        .mod-group .chip { margin: 1px 2px; }
        .mod-badge {
            position: absolute;
            top: -1rem;
            left: -0.85rem;
            width: 1.75rem;
            height: 1.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            background: #dc2626;
            border: 2px solid #991b1b;
            color: #fff;
            font-size: 20px;
            font-weight: 900;
            line-height: 1;
            user-select: none;
            pointer-events: none;
            z-index: 1;
        }
        .uncov-sample {
            color: #fff;
            font-weight: 700;
            border: 1px dashed #6b7280;
            border-radius: 4px;
            padding: 0 4px;
        }

        /* 右上角的 ✕ 刪除鈕 */
        .seq-del { position: absolute; top: -7px; right: -7px; width: 17px; height: 17px; border-radius: 9999px; background: #dc2626; border: 1px solid #7f1d1d; color: #fff; font-size: 10px; font-weight: 900; line-height: 15px; text-align: center; display: none; z-index: 2; }
        .seq-del:hover { background: #ef4444; transform: scale(1.15); }
        .tray-chip:hover .seq-del, .mod-row:hover .seq-del { display: block; }
        /* 觸控裝置沒有「滑過」，✕ 一直顯示 */
        @media (hover: none) { .tray-chip .seq-del, .mod-row .seq-del { display: block; } }

        /* 第 3 關：概念對照 (拖曳作答) */
        .concept-table th, .concept-table td { border: 1px solid #374151; padding: 0.5rem 0.75rem; }
        .concept-table th { background: #1f2937; color: #ffc72c; }
        /* Scratch 截圖選項 */
        .quiz-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 10px;
            background: #fff;
            border: 3px solid #38bdf8;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            cursor: grab;
        }
        .quiz-chip img { display: block; max-height: 112px; max-width: 220px; pointer-events: none; }
        .quiz-chip:hover { border-color: #ffc72c; }
        .quiz-locked .quiz-chip { cursor: default; }
        .quiz-ghost { position: fixed; z-index: 60; pointer-events: none; opacity: 0.9; transform: translate(-50%, -50%) rotate(-2deg); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6); cursor: grabbing; }
        .drop-cell { min-height: 134px; border: 2px dashed #4b5563; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 0.75rem; padding: 6px; }
        .answer-thumb { display: inline-block; background: #fff; border-radius: 6px; padding: 3px; }
        .answer-thumb img { max-height: 70px; max-width: 110px; display: block; }
        .drop-hover { border-color: #ffc72c !important; background: rgba(255, 199, 44, 0.12); }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        .animate-pop { animation: pop 0.2s ease-in-out; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
    <!-- 提示訊息框 (Toast) -->
    <div id="toastMessage" class="fixed top-5 left-1/2 -translate-x-1/2 transform bg-red-600 text-white font-bold px-6 py-3 rounded shadow-2xl z-50 transition-opacity duration-300 opacity-0 pointer-events-none max-w-[90vw] text-center"></div>

    <!-- 確認視窗 -->
    <div id="confirmModal" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-4">
        <div class="bg-[#1a1a1a] border border-gray-700 rounded-xl p-5 max-w-md w-full shadow-2xl">
            <div id="confirmText" class="text-white text-lg mb-5 whitespace-pre-wrap leading-relaxed"></div>
            <div class="flex justify-end gap-3">
                <button onclick="hideConfirm()" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-5 rounded">取消</button>
                <button id="confirmOk" class="bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-5 rounded">刪除</button>
            </div>
        </div>
    </div>

    <!-- 關卡說明視窗 -->
    <div id="infoModal" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-4">
        <div class="bg-[#1a1a1a] border-2 border-[#ffc72c] rounded-xl p-6 max-w-lg w-full shadow-[0_0_40px_rgba(255,199,44,0.25)]">
            <div id="infoTitle" class="text-2xl font-black text-[#ffc72c] mb-3"></div>
            <div id="infoBody" class="text-gray-200 text-lg leading-relaxed mb-6"></div>
            <div class="text-right">
                <button onclick="hideInfo()" class="bg-[#ffc72c] hover:bg-yellow-400 text-black font-black py-2 px-6 rounded-full">開始 ▶</button>
            </div>
        </div>
    </div>

    <!-- 標題列：標題 + 三關成績 + 帳號 + 復原 -->
    <header class="bg-[#111] px-3 py-2 border-b border-gray-800 flex items-center gap-3 z-10 shrink-0 shadow-md">
        <h1 class="text-[2.8rem] leading-none font-black tracking-wider text-[#ffc72c] shrink-0">點餐大師</h1>
        <nav id="scoreboard" class="flex-1 min-w-0 flex flex-wrap items-center gap-2"></nav>
        <div id="accountInfo" class="hidden text-xs text-gray-400 text-right leading-tight shrink-0">
            <div id="accountEmail"></div>
            <div id="syncStatus"></div>
        </div>
        <button id="undoBtn" onclick="undo()" title="復原上一步 (Ctrl+Z)" class="shrink-0 bg-gray-800 hover:bg-gray-700 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-gray-800 text-white text-[1.3125rem] font-bold py-1.5 px-4 rounded border border-gray-600 transition-colors">↶ 復原</button>
    </header>

    <!-- 第 1、2 關：三欄共用同一套格線：標題 / 上方提示 / 主要內容 / 下方資訊 -->
    <main id="mainGrid" class="flex-1 min-h-0 grid" style="grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto;">

        <!-- 第 1 排：欄位標題 -->
        <div class="tab-header bg-[#da291c] shadow-lg shadow-red-900/50 text-white z-10 relative">
            <span id="head1"></span>
            <div class="tab-arrow-r" style="border-left-color:#da291c"></div>
        </div>
        <div class="tab-header bg-[#355c7d] shadow-lg shadow-blue-900/50 text-white z-10 relative">
            <div class="tab-arrow-l" style="border-left-color:#0a0a0a"></div>
            <span id="head2"></span>
            <div class="tab-arrow-r" style="border-left-color:#355c7d"></div>
        </div>
        <div class="tab-header bg-[#759e66] shadow-lg shadow-green-900/50 text-white z-10 relative">
            <div class="tab-arrow-l" style="border-left-color:#111"></div>
            <span id="head3"></span>
        </div>

        <!-- 第 2 排：上方提示 (依關卡改變) -->
        <div class="bg-[#0a0a0a] border-r border-gray-800 px-4 pt-3 flex flex-col">
            <div id="tip1" class="flex-1 bg-[#1a1a1a] px-3 py-2 rounded border border-gray-800 text-[1.05rem] leading-relaxed text-gray-400 font-medium"></div>
        </div>
        <div class="bg-[#111] border-r border-gray-800 px-4 pt-3 flex flex-col">
            <div id="tip2" class="flex-1 bg-[#1a1a1a] px-3 py-2 rounded border border-gray-800 text-[1.05rem] leading-relaxed text-gray-400 font-medium"></div>
        </div>
        <!-- 右上：完成進度、點擊次數、進入下一關 -->
        <div class="bg-gray-950 px-4 pt-3 flex flex-col">
            <div class="relative flex-1 bg-[#1a1a1a] px-3 py-2 rounded border border-gray-800 text-sm text-gray-400 flex flex-col justify-center gap-1">
                <div id="lockNote" class="hidden text-center font-bold text-gray-300">🔒 這一關已經完成並鎖定，只能查看</div>
                <div id="progressLine" class="min-w-0 flex items-center gap-2 h-7 whitespace-nowrap">
                    <span class="shrink-0">完成</span>
                    <div class="flex-1 h-2.5 bg-gray-800 rounded-full overflow-hidden">
                        <div id="doneBar" class="h-full bg-sky-500 transition-all duration-300" style="width:0%"></div>
                    </div>
                    <span id="doneText" class="text-white font-bold w-14 text-right">0/15</span>
                </div>
                <div id="errorBox" class="hidden min-w-0 rounded-lg px-2 py-0.5 text-center font-bold bg-red-900 text-white border border-red-700"></div>
                <div id="successBanner" class="hidden min-w-0 rounded-lg px-2 py-0.5 text-lg text-center font-black bg-[#e8c338] text-black border border-yellow-500 shadow-[0_0_12px_rgba(232,195,56,0.5)] whitespace-nowrap overflow-hidden text-ellipsis"></div>
                <!-- 點擊統計：成功 / 錯誤 / 總點擊 (累計，不會因為移除或復原而減少) -->
                <div class="flex justify-center gap-3 whitespace-nowrap">
                    <span>成功 <b id="okCount" class="text-emerald-400 text-xl">0</b></span>
                    <span>錯誤 <b id="errCount" class="text-red-400 text-xl">0</b></span>
                    <span>總點擊 <b id="clickCount" class="text-yellow-400 text-xl">0</b></span>
                </div>
                <button id="compareBtn" onclick="showCompare()" class="hidden bg-sky-700 hover:bg-sky-600 text-white text-sm font-bold py-1 rounded-full">📊 和第 1 關比一比</button>
                <button id="nextBtn" onclick="advance()" class="hidden bg-[#759e66] hover:bg-[#5a7d4e] text-white font-black py-1 rounded-full shadow-[0_0_12px_rgba(117,158,102,0.6)] animate-pulse"></button>
            </div>
        </div>

        <!-- 第 3 排：主要內容 (左右兩欄同步捲動) -->
        <div class="bg-[#0a0a0a] border-r border-gray-800 px-4 py-3 min-h-0 flex flex-col">
            <div id="ordersScroll" class="flex-1 min-h-0 overflow-y-auto hide-scrollbar bg-[#111827] border border-gray-700 rounded p-2 shadow-inner">
                <div id="ordersList" class="flex flex-col gap-1.5"></div>
            </div>
        </div>
        <div class="bg-[#111] border-r border-gray-800 px-4 py-3 min-h-0 flex flex-col">
            <div class="flex-1 min-h-0 overflow-y-auto hide-scrollbar flex flex-col gap-2 pr-1">
                <!-- 點餐機螢幕：只放得下 5 個套餐按鈕 -->
                <div id="moduleScreen" class="bg-black border-4 border-gray-600 rounded-xl p-2 shadow-[inset_0_0_20px_rgba(0,0,0,0.8)]">
                    <div class="text-[1.3125rem] font-bold text-[#ffb480] flex items-center justify-between px-1 pb-1.5">
                        <span>📦 套餐按鈕<span class="text-gray-400 font-normal ml-1">(最多5個)</span></span>
                        <span id="moduleCountText" class="text-[1.125rem] text-gray-400 font-normal"></span>
                    </div>
                    <div id="moduleList" class="flex flex-col gap-2"></div>
                </div>
                <div id="menuTitle" class="text-[1.3125rem] font-bold text-gray-300 mt-1">🍽️ 單點品項</div>
                <div id="menuContainer" class="flex flex-col gap-1.5 pb-1"></div>
            </div>
        </div>
        <div class="bg-gray-950 px-4 py-3 min-h-0 flex flex-col">
            <div id="trayScroll" class="flex-1 min-h-0 overflow-y-auto hide-scrollbar bg-[#111827] border border-gray-700 rounded p-2 shadow-inner">
                <div id="trayList" class="flex flex-col gap-1.5"></div>
            </div>
        </div>

        <!-- 第 4 排：下方資訊 (第 2 關才顯示) -->
        <div id="info1" class="row4 bg-black border-t border-r border-gray-800 px-4 py-2 flex items-center justify-center gap-3 text-sm text-gray-400 text-center"></div>
        <div class="row4 bg-[#0a0a0a] border-t border-r border-gray-800"></div>
        <div class="row4 bg-black border-t border-gray-800"></div>
    </main>
    <div class="fixed bottom-0.5 right-1.5 text-[9px] text-gray-700 leading-none pointer-events-none z-20">桃園市建國國中詹智傑老師設計(2026)</div>

    <!-- 第 2、3 關還沒解鎖時：內容是空的，只顯示提醒 -->
    <section id="lockPanel" class="hidden flex-1 min-h-0 flex-col items-center justify-center gap-4 bg-[#0a0a0a] text-center px-4">
        <div class="text-7xl">🔒</div>
        <div id="lockTitle" class="text-3xl font-black text-[#ffc72c]"></div>
        <div id="lockText" class="text-gray-300 text-xl leading-relaxed"></div>
        <div class="mt-2 flex flex-wrap justify-center gap-4">
            <button id="lockBack" class="bg-[#759e66] hover:bg-[#5a7d4e] text-white text-xl font-black py-2 px-8 rounded-full shadow-lg"></button>
            <button id="lockSkip" class="bg-sky-700 hover:bg-sky-600 text-white text-xl font-black py-2 px-8 rounded-full shadow-lg"></button>
        </div>
    </section>

    <!-- 第 2 關完成時：和第 1 關比較點擊次數 -->
    <div id="compareModal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4">
        <div class="bg-[#111] border-2 border-[#ffc72c] rounded-2xl p-6 max-w-2xl w-full shadow-[0_0_50px_rgba(255,199,44,0.3)]">
            <div class="text-3xl font-black text-[#ffc72c] mb-1 text-center">📊 模組的效率</div>
            <div class="text-gray-400 text-center mb-4">同樣的 15 單，用單點和用套餐差多少？</div>
            <div id="compareBody"></div>
            <div class="text-right mt-5">
                <button onclick="hideCompare()" class="bg-[#ffc72c] hover:bg-yellow-400 text-black font-black py-2 px-6 rounded-full">關閉</button>
            </div>
        </div>
    </div>

    <!-- 第 4 關：概念對照 (把 Scratch 選項拖到表格中) -->
    <section id="quizPanel" class="hidden flex-1 min-h-0 overflow-y-auto hide-scrollbar bg-[#0a0a0a]">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col gap-3">
            <div class="text-center">
                <div class="text-3xl font-black text-[#ffc72c]">第 4 關：概念對照</div>
                <div class="text-gray-300 text-xl mt-1">你剛剛做的事，在程式設計裡就叫做「<b class="text-white">模組化</b>」</div>
            </div>
            <div class="text-gray-300 text-xl leading-snug bg-[#1a1a1a] border border-gray-700 rounded-lg px-4 py-2">
                💡 把下方的 <b class="text-sky-300">Scratch 積木圖</b>拖到表格中正確的格子，全部放好後按「送出答案」。<b class="text-[#ffc72c]">答對一題 7 分，全對 20 分</b>，送出後就不能修改。
            </div>
            <div id="quizArea"></div>
            <div class="text-right text-[10px] text-gray-700">桃園市建國國中詹智傑老師設計(2026)</div>
        </div>
    </section>

    <script>
        // ===================== 資料 =====================

        const MENU_CATEGORIES = [
            { title: '西式主餐', items: [
                { id: 'm1', name: '豬排漢堡' }, { id: 'm2', name: '生菜沙拉' },
                { id: 'm3', name: '火腿蛋吐司' }, { id: 'm4', name: '花生厚片' } ] },
            { title: '中式主餐', items: [
                { id: 'm5', name: '原味蛋餅' }, { id: 'm6', name: '鮪魚蛋餅' },
                { id: 'm7', name: '蛋炒飯' }, { id: 'm8', name: '鐵板麵' } ] },
            { title: '中式點心', items: [
                { id: 'm9', name: '蘿蔔糕' }, { id: 'm10', name: '蔥抓餅' },
                { id: 'm11', name: '煎餃' }, { id: 'm12', name: '荷包蛋' } ] },
            { title: '炸物小點', items: [
                { id: 'm13', name: '炸雞塊' }, { id: 'm14', name: '熱狗' },
                { id: 'm15', name: '黃金脆薯' }, { id: 'm16', name: '薯餅' } ] },
            { title: '飲料區', items: [
                { id: 'm17', name: '冰奶茶' }, { id: 'm18', name: '冰紅茶' },
                { id: 'm19', name: '溫豆漿' }, { id: 'm20', name: '熱咖啡' } ] }
        ];
        const MENU_ITEMS = MENU_CATEGORIES.flatMap(cat => cat.items);
        const itemName = (id) => (MENU_ITEMS.find(m => m.id === id) || {}).name || id;

        // 第 1 關：今天常見的 15 張訂單
        const TODAY_ORDERS = [
            { id: 1, items: ['m8', 'm12', 'm17', 'm14'] },
            { id: 2, items: ['m1', 'm15', 'm18'] },
            { id: 3, items: ['m4', 'm20'] },
            { id: 4, items: ['m5', 'm9', 'm19', 'm11'] },
            { id: 5, items: ['m2', 'm12', 'm17'] },
            { id: 6, items: ['m8', 'm12', 'm17'] },
            { id: 7, items: ['m1', 'm18', 'm12'], fullWithoutModule: true },   // 用不到套餐，單點完成也得 4 分
            { id: 8, items: ['m4', 'm20', 'm16'] },
            { id: 9, items: ['m5', 'm9', 'm19'] },
            { id: 10, items: ['m2', 'm12', 'm10'] },
            { id: 11, items: ['m1', 'm15', 'm18', 'm13'] },
            { id: 12, items: ['m4', 'm20', 'm11'] },
            { id: 13, items: ['m5', 'm9', 'm19', 'm13'] },
            { id: 14, items: ['m8', 'm12', 'm17', 'm16'] },
            { id: 15, items: ['m2', 'm12', 'm9', 'm19'] }
        ];
        // 第 2 關：明天的 10 張新訂單 (檢驗套餐是否通用)
        const TOMORROW_ORDERS = [
            { id: 1, items: ['m8', 'm12', 'm17', 'm16'] },

        const esc = (str) => String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function stampNow() {
            const now = new Date();
            const p2 = (n) => String(n).padStart(2, '0');
            lastSolvedStamp = `${now.getMonth() + 1}/${now.getDate()} ${p2(now.getHours())}:${p2(now.getMinutes())}:${p2(now.getSeconds())}`;
        }

        // 目前這一關還可以操作 (第 4 關隨時可以作答，送出後鎖定)
        // 第 1～3 關：已經解鎖、而且還沒按「進入下一關」關閉的關卡都可以操作 (先跳關的關卡之後還能回來做)
        const closed = { 1: false, 2: false, 3: false };
        const isEditable = () => stage === QUIZ_STAGE ? !quiz.submitted : (stage <= unlocked && !closed[stage]);
        const isLockedView = () => (stage === 2 || stage === 3) && unlocked < stage;  // 前一關還沒完成就點開
        const canDefine = () => stage === 2 && isEditable();    // 只有第 2 關可以建立、刪除套餐
        const canServe = () => isEditable() && stage < QUIZ_STAGE;  // 第 1～3 關可以點餐
        const hasModules = () => stage >= 2;                     // 第 1 關沒有套餐

        let toastTimer1 = null, toastTimer2 = null;
        function showMessage(text, type = 'error') {
            const colors = { error: 'bg-red-600', info: 'bg-sky-600', success: 'bg-emerald-600' };
            const toast = document.getElementById('toastMessage');
            toast.className = `fixed top-5 left-1/2 -translate-x-1/2 transform ${colors[type] || colors.error} text-white font-bold px-6 py-3 rounded shadow-2xl z-50 transition-opacity duration-300 opacity-0 pointer-events-none max-w-[90vw] text-center`;
            toast.innerText = text;
            clearTimeout(toastTimer1);
            clearTimeout(toastTimer2);
            toastTimer1 = setTimeout(() => toast.classList.remove('opacity-0'), 10);
            toastTimer2 = setTimeout(() => toast.classList.add('opacity-0'), 2500);
        }

        function askConfirm(text, onOk, okLabel = '刪除', okClass = 'bg-red-600 hover:bg-red-500') {
            const modal = document.getElementById('confirmModal');
            document.getElementById('confirmText').innerText = text;
            const ok = document.getElementById('confirmOk');
            ok.textContent = okLabel;
            ok.className = `${okClass} text-white font-bold py-2 px-5 rounded`;
            ok.onclick = () => { hideConfirm(); onOk(); };
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function hideConfirm() {
            const modal = document.getElementById('confirmModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function showInfo(title, html) {
            document.getElementById('infoTitle').textContent = title;
            document.getElementById('infoBody').innerHTML = html;
            const modal = document.getElementById('infoModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function hideInfo() {
            const modal = document.getElementById('infoModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // ===================== 復原 (第 1、2 關) =====================

        function snapshot() {
            history.push(JSON.stringify({ modules, trays, activeOrder }));
            if (history.length > 100) history.shift();
        }

        function undo() {
            if (stage === QUIZ_STAGE || isLockedView()) return;
            if (history.length === 0) {
                showMessage('沒有可以復原的動作', 'info');
                return;
            }
            const s = JSON.parse(history.pop());
            modules = s.modules;
            trays = s.trays;
            activeOrder = s.activeOrder;
            updateAll();
            showMessage('已復原上一步', 'info');
        }

        function updateUndoBtn() {
            document.getElementById('undoBtn').disabled = stage === QUIZ_STAGE || isLockedView() || history.length === 0;
        }

        // ===================== 初始化 =====================

        window.onload = () => {
            // 第 1 關：按住滑鼠拖過餐點來建立套餐 (可能在訂單區外放開，所以 move / up 監聽整個頁面)
            document.getElementById('ordersList').addEventListener('pointerdown', pickStart);
            document.addEventListener('pointermove', pickMove);
            document.addEventListener('pointerup', pickEnd);
            document.addEventListener('pointercancel', pickCancel);
            // 第 3 關：拖曳 Scratch 選項
            document.getElementById('quizArea').addEventListener('pointerdown', quizDown);
            document.addEventListener('pointermove', quizMove);
            document.addEventListener('pointerup', quizUp);
            document.addEventListener('pointercancel', quizCancel);
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
                    e.preventDefault();
                    undo();
                } else if (e.key === 'Escape') {
                    hideConfirm();
                    hideInfo();
                    hideCompare();
                }
            });
            linkScroll(document.getElementById('ordersScroll'), document.getElementById('trayScroll'));
            window.addEventListener('resize', syncRowHeights);
            updateAll();
            initAccount();
        };

        function updateAll() {
            const isQuiz = stage === QUIZ_STAGE;
            const isLock = isLockedView();
            document.getElementById('mainGrid').classList.toggle('hidden', isQuiz || isLock);
            document.getElementById('quizPanel').classList.toggle('hidden', !isQuiz);
            const lockPanel = document.getElementById('lockPanel');
            lockPanel.classList.toggle('hidden', !isLock);
            lockPanel.classList.toggle('flex', isLock);
            if (isLock) {
                const prev = stage - 1;
                document.getElementById('lockTitle').textContent = `請先完成第 ${prev} 關`;
                document.getElementById('lockText').innerHTML = `完成第 ${prev} 關的 ${STAGES[prev].orders.length} 單後，才能開始第 ${stage} 關。`;
                const back = document.getElementById('lockBack');
                back.textContent = `◀ 回到第 ${unlocked} 關`;
                back.onclick = () => viewStage(unlocked);
                const skip = document.getElementById('lockSkip');
                skip.textContent = `先跳到第 ${stage} 關 ▶`;
                skip.onclick = () => skipTo(stage);
                renderScoreboard();
                updateUndoBtn();
                return;
            }
            if (isQuiz) {
                renderQuiz();
                renderScoreboard();
                updateUndoBtn();
                return;
            }
            renderStageText();
            renderOrders();
            renderModules();
            renderMenu();
            renderTrays();
            updateStats();
            updateUndoBtn();
            syncRowHeights();
        }

        // ===================== 關卡切換 =====================

        // 只儲存真正在進行的第 1～3 關 (還沒解鎖的關卡畫面是空的，不用存)
        function saveStage() {
            if (stage < QUIZ_STAGE && unlocked >= stage) stageData[stage] = { modules, trays, activeOrder, history };
        }

        function loadStage(s) {
            stage = s;
            if (s === QUIZ_STAGE || !stageData[s]) return;
            orders = STAGES[s].orders;
            const d = stageData[s];
            // 第 3 關的套餐一律沿用第 2 關的套餐
            modules = (s === 3 && stageData[2]) ? stageData[2].modules : d.modules;
            trays = d.trays;
            activeOrder = d.activeOrder;
            history = d.history;
        }

        // 點標題列的關卡切換查看
        function viewStage(s) {
            if (s === stage) return;
            saveStage();
            loadStage(s);
            updateAll();
            if (s < QUIZ_STAGE && !isLockedView()) {
                document.getElementById('ordersScroll').scrollTop = 0;
                document.getElementById('trayScroll').scrollTop = 0;
            }
        }

        // 進入下一關
        function advance() {
            if (!isEditable() || stage >= QUIZ_STAGE || !isSolved()) return;
            const next = stage + 1;
            const text = {
                2: '進入第 2 關後，第 1 關就不能再修改。\n\n確定要進入第 2 關嗎？',
                3: '進入第 3 關後，螢幕上的 5 個套餐按鈕就固定了，第 2 關不能再修改。\n\n確定要進入第 3 關嗎？',
                4: '進入第 4 關後，第 3 關就不能再修改。\n\n確定要進入第 4 關嗎？'
            }[next];
            askConfirm(text, () => {
                saveStage();
                closed[stage] = true;   // 正常過關：這一關鎖定
                enterStage(next);
            }, `進入第 ${next} 關`, 'bg-[#759e66] hover:bg-[#5a7d4e]');
        }

        // 還沒完成前一關，就先跳到第 target 關 (沒完成的關卡之後還可以回來做)
        function skipTo(target) {
            if (target <= unlocked) return;
            const from = unlocked;
            const text = `第 ${from} 關還沒完成拿到${STAGE_MAX[from]}分滿分喔！\n待會兒記得要回到第 ${from} 關。\n確定先跳到第 ${target} 關嗎？`;
            askConfirm(text, () => {
                if (stage === from) saveStage();
                for (let n = from + 1; n <= target; n++) enterStage(n, n === target);
            }, `先跳到第 ${target} 關`, 'bg-sky-700 hover:bg-sky-600');
        }

        // 解鎖並進入第 next 關 (showIt=false 時只解鎖、不切換畫面)
        function enterStage(next, showIt = true) {
            if (next <= unlocked) {   // 之前先跳過來的關卡：已經開始了，直接切換過去
                if (showIt) viewStage(next);
                return;
            }
            unlocked = next;
            if (next === 2) {
                // 第 2 關：同樣的 15 單，這次可以建立套餐
                stageData[2] = { modules: [], trays: TODAY_ORDERS.map(() => []), activeOrder: 0, history: [] };
            } else if (next === 3) {
                // 第 3 關：新的 10 單，沿用第 2 關的套餐 (不能修改)
                stageData[3] = { modules: stageData[2].modules, trays: TOMORROW_ORDERS.map(() => []), activeOrder: 0, history: [] };
            }
            if (!showIt) return;
            loadStage(next);
            updateAll();
            if (next < QUIZ_STAGE) {
                document.getElementById('ordersScroll').scrollTop = 0;
                document.getElementById('trayScroll').scrollTop = 0;
            }
            {
                if (next === 2) {
                    const c = counts[1];
                    showInfo('第 2 關：建立套餐、呼叫套餐', `同樣的 <b class="text-white">15 張訂單</b>，這次請先<b class="text-[#ffc72c]">建立套餐</b>！<br>點餐螢幕只能放 5 個套餐按鈕，需找出經常出現的餐點組合，建立為套餐。<br><br>第 1 關你總共點了 <b class="text-white">${c.ok + c.err}</b> 次，<br>這次能少點幾次？`);
                } else if (next === 3) {
                    showInfo('第 3 關：明天的新訂單', `明天來了 <b class="text-white">10 張新訂單</b>！<br>螢幕上的 5 個套餐按鈕<b class="text-[#ffc72c]">已經固定，不能修改</b>。<br><br>看看你設計的套餐，明天還好不好用？`);
                } else if (!quiz.submitted) {
                    showInfo('第 4 關：概念對照', `你剛剛設計套餐、用套餐點餐，其實就是程式設計裡的「<b class="text-white">模組化</b>」！<br><br>請把 <b class="text-sky-300">Scratch 積木圖</b>拖到表格中正確的位置，<br>答對一題 7 分，全對 20 分。`);
                }
            }
        }

        // 依關卡更新欄位標題與提示
        function renderStageText() {
            const heads = {
                1: ['1. 今日點餐', '2. 單點品項', '3. 點餐（單點）'],
                2: ['1. 今日點餐', '2. 定義套餐', '3. 點餐（呼叫套餐＋單點）'],
                3: ['1. 明日點餐', '2. 套餐（已固定）', '3. 點餐（呼叫套餐＋單點）']
            }[stage];
            heads.forEach((t, i) => { document.getElementById('head' + (i + 1)).textContent = t; });

            const tips = {
                1: [`💡 ${orders.length}張訂單，共${sumItems(orders)}個餐點。`,
                    '💡 點選下面品項，放進右側托盤。'],
                2: [`💡 ${orders.length}張訂單，${sumItems(orders)}個餐點，<b class="text-gray-200">找出經常出現的餐點組合</b>，定義為套餐；<span class="text-red-400 font-bold">紅框</span>＝套餐`,
                    '💡 <b class="text-gray-200">在左側訂單選取2~3個餐點來建立套餐</b>。'],
                3: ['💡 明天的新訂單：你的套餐還用得上嗎？<span class="text-red-400 font-bold">紅框</span>＝套餐用得上的地方',
                    '🔒 螢幕上的套餐按鈕<b class="text-gray-200">已經固定</b>，不能再修改']
            }[stage];
            tips.forEach((t, i) => { document.getElementById('tip' + (i + 1)).innerHTML = t; });
            // 第 1 關沒有套餐：隱藏套餐按鈕區，左欄餐點不用虛線框
            document.getElementById('moduleScreen').classList.toggle('hidden', !hasModules());
            document.getElementById('ordersList').classList.toggle('plain', !hasModules());
            // 已鎖定的關卡：右上顯示鎖定提示
            document.getElementById('lockNote').classList.toggle('hidden', isEditable());
            // 下方資訊列只在第 3 關顯示
            document.querySelectorAll('.row4').forEach(el => el.classList.toggle('hidden', stage !== 3));
        }

        // ===================== 左右兩欄同步捲動、列高對齊 =====================

        function linkScroll(a, b) {
            let leader = null, timer = null;
            const follow = (src, dst) => () => {
                if (leader && leader !== src) return; // 被帶動的捲動，不再反向帶動
                leader = src;
                dst.scrollTop = src.scrollTop;
                clearTimeout(timer);
                timer = setTimeout(() => { leader = null; }, 100);
            };
            a.addEventListener('scroll', follow(a, b));
            b.addEventListener('scroll', follow(b, a));
        }

        // 讓左邊的訂單和右邊的托盤每一列一樣高，捲動時才能逐單對齊
        function syncRowHeights() {
            if (stage === QUIZ_STAGE) return;
            const L = document.querySelectorAll('#ordersList > [data-row]');
            const R = document.querySelectorAll('#trayList > [data-row]');
            L.forEach((l, i) => { l.style.minHeight = ''; if (R[i]) R[i].style.minHeight = ''; });
            L.forEach((l, i) => {
                if (!R[i]) return;
                const h = Math.max(l.offsetHeight, R[i].offsetHeight);
                l.style.minHeight = R[i].style.minHeight = h + 'px';
            });
        }

        // ===================== 判定 =====================

        // 一單的狀態：empty (空) / partial (還沒完成，但目前都對) / done (完成) / error (有多餘或不對的品項)
        function statusOf(order, tray, mods) {
            if (tray.length === 0) return 'empty';
            const list = [];
            tray.forEach(p => {
                if (p.type === 'item') list.push(p.ref);
                else {
                    const mod = mods.find(m => m.id === p.ref);
                    if (mod) list.push(...mod.items);
                }
            });
            const need = {};
            order.items.forEach(id => { need[id] = (need[id] || 0) + 1; });
            for (const id of list) {
                if (!need[id]) return 'error';
                need[id]--;
            }
            return Object.values(need).every(n => n === 0) ? 'done' : 'partial';
        }

        const orderStatus = (i) => statusOf(orders[i], trays[i], modules);

        // 第 1 關：比對托盤裡的單點和訂單，找出已經放對的餐點
        // gotK：訂單中已經放對的第幾個餐點；okJ：托盤中放對的第幾個項目
        function matchSingles(order, tray) {
            const remaining = order.items.map((id, k) => ({ id, k }));
            const gotK = new Set(), okJ = new Set();
            tray.forEach((p, j) => {
                if (p.type !== 'item') return;
                const idx = remaining.findIndex(r => r.id === p.ref);
                if (idx === -1) return;
                gotK.add(remaining[idx].k);
                okJ.add(j);
                remaining.splice(idx, 1);
            });
            return { gotK, okJ };
        }

        const isSolved = () => orders.every((_, i) => orderStatus(i) === 'done');

        // 從 from 的下一單開始，找還沒完成的訂單 (繞一圈)
        function nextIncomplete(from) {
            const n = orders.length;
            for (let k = 1; k <= n; k++) {
                const i = (from + k) % n;
                if (orderStatus(i) !== 'done') return i;
            }
            return null;
        }

        // 找出每張訂單中，每個品項屬於哪個套餐 (品項多的套餐優先，不重疊)
        function computeCoverage() {
            const sorted = [...modules].sort((a, b) => b.items.length - a.items.length || a.id.localeCompare(b.id));
            return orders.map(o => {
                const owner = o.items.map(() => null);
                sorted.forEach(mod => {
                    const idxs = mod.items.map(it => o.items.findIndex((x, k) => x === it && owner[k] === null));
                    if (idxs.every(k => k >= 0)) idxs.forEach(k => { owner[k] = mod.id; });
                });
                return owner;
            });
        }

        // ===================== 1. 左欄：訂單、拖過餐點定義套餐 =====================

        function renderOrders() {
            const cov = computeCoverage();
            const list = document.getElementById('ordersList');
            list.classList.toggle('can-define', canDefine());
            list.innerHTML = orders.map((o, i) => {
                const st = orderStatus(i);
                const active = canServe() && i === activeOrder;
                const cls = active ? 'border-[#ffc72c] bg-yellow-900/20'
                    : st === 'done' ? 'border-green-800/60 bg-green-900/10'
                    : 'border-gray-800 bg-gray-900/40';
                // 同一個套餐的品項放進同一個紅框，只標一個代號
                const owner = cov[i];
                // 第 1 關：已經正確放進托盤的餐點亮綠框
                const got = hasModules() ? new Set() : matchSingles(o, trays[i]).gotK;
                const chip = (k) => `<span class="chip ${owner[k] ? 'cov' : 'uncov'}${got.has(k) ? ' got' : ''}" data-o="${i}" data-k="${k}">${esc(itemName(o.items[k]))}</span>`;
                const shown = new Set();
                let chips = '';
                o.items.forEach((it, k) => {
                    if (shown.has(k)) return;
                    const m = owner[k];
                    if (!m) { chips += chip(k); return; }
                    const ks = owner.map((x, kk) => x === m ? kk : -1).filter(kk => kk >= 0);
                    ks.forEach(kk => shown.add(kk));
                    chips += `<span class="mod-group"><span class="mod-badge">${m}</span>${ks.map(chip).join('')}</span>`;
                });
                return `<div data-row="${i}" onclick="clickOrderCard(${i})" class="flex items-center gap-2 px-1.5 py-1 rounded-lg border-2 transition-colors ${cls}">
                    <div class="w-7 shrink-0 text-center leading-none">
                        <div class="${active ? 'text-[#ffc72c] font-black' : 'text-gray-300 font-bold'} text-xl">${o.id}</div>
                        ${st === 'done' ? '<div class="text-green-500 text-[10px] font-bold mt-0.5">✔</div>' : ''}
                    </div>
                    <div class="order-items flex-1 py-1">${chips}</div>
                </div>`;
            }).join('');
        }

        // 點左邊的訂單也能選取這一單 (剛拖曳建立套餐時除外)
        let suppressCardClick = false;
        function clickOrderCard(i) {
            if (suppressCardClick) { suppressCardClick = false; return; }
            selectOrder(i);
        }

        // ---------- 按住滑鼠拖過餐點：從起點到目前位置的餐點整顆被選取 ----------
        let pick = null;  // { o, chips:[同一單的餐點元素 (畫面順序)], start, cur }

        function pickStart(e) {
            if (!canDefine()) return;
            if (e.button !== undefined && e.button !== 0) return;
            const chip = e.target.closest('.chip');
            if (!chip) return;
            e.preventDefault();
            const o = Number(chip.dataset.o);
            if (chip.classList.contains('cov')) {
                const id = computeCoverage()[o][Number(chip.dataset.k)];
                showMessage(`這個餐點已經屬於套餐 ${id}，請選虛線框的餐點`, 'info');
                return;
            }
            const chips = [...document.querySelectorAll(`#ordersList .chip[data-o="${o}"]`)];
            const start = chips.indexOf(chip);
            pick = { o, chips, start, cur: start };
            paintPick();
        }

        function pickMove(e) {
            if (!pick) return;
            e.preventDefault();
            const el = document.elementFromPoint(e.clientX, e.clientY);
            const chip = el && el.closest('.chip');
            // 只接受同一張訂單裡的餐點；移到別處就維持原本的選取
            if (!chip || Number(chip.dataset.o) !== pick.o) return;
            const idx = pick.chips.indexOf(chip);
            if (idx !== -1 && idx !== pick.cur) {
                pick.cur = idx;
                paintPick();
            }
        }

        // 目前被選取的餐點：從起點往目前位置走，碰到紅框套餐裡的餐點就停
        function pickedChips() {
            const { chips, start, cur } = pick;
            const step = cur >= start ? 1 : -1;
            const list = [];
            for (let i = start; ; i += step) {
                if (chips[i].classList.contains('cov')) break;
                list.push(chips[i]);
                if (i === cur) break;
            }
            return list;
        }

        function paintPick() {
            const picked = pickedChips();
            const tooMany = picked.length > MAX_ITEMS;
            pick.chips.forEach(c => c.classList.remove('picking', 'too-many'));
            picked.forEach(c => {
                c.classList.add('picking');
                if (tooMany) c.classList.add('too-many');
            });
        }

        function pickCancel() {
            if (!pick) return;
            pick.chips.forEach(c => c.classList.remove('picking', 'too-many'));
            pick = null;
        }

        function pickEnd() {
            if (!pick) return;
            const o = pick.o;
            const ks = pickedChips().map(c => Number(c.dataset.k)).sort((a, b) => a - b);
            pickCancel();
            if (ks.length === 1) return;  // 只點一下：當作選取這一單 (交給 click)
            suppressCardClick = true;
            setTimeout(() => { suppressCardClick = false; }, 0);
            defineModule(o, ks);
        }

        // 用第 o 單裡第 ks 個餐點建立套餐
        function defineModule(o, ks) {
            if (ks.length < MIN_ITEMS || ks.length > MAX_ITEMS) {
                showMessage(`套餐要包含 ${MIN_ITEMS}～${MAX_ITEMS} 個餐點，你選了 ${ks.length} 個`);
                return;
            }
            if (modules.length >= MAX_MODULES) {
                showMessage(`點餐機螢幕只放得下 ${MAX_MODULES} 個套餐按鈕，要先刪掉一個才能再建立`);
                return;
            }

            const items = ks.map(k => orders[o].items[k]);
            const key = [...items].sort().join(',');
            const dup = modules.find(m => [...m.items].sort().join(',') === key);
            if (dup) {
                showMessage(`這個組合已經是套餐 ${dup.id} 了`, 'info');
                return;
            }

            const usedIds = modules.map(m => m.id);
            let nextId = null;
            for (let c = 65; c <= 90; c++) {
                const ch = String.fromCharCode(c);
                if (!usedIds.includes(ch)) { nextId = ch; break; }
            }

            snapshot();
            modules.push({ id: nextId, items });
            modules.sort((a, b) => a.id.localeCompare(b.id));
            updateAll();
            showMessage(`已建立套餐 ${nextId}`, 'success');
        }

        // ===================== 2. 中欄：點餐機螢幕 (套餐按鈕)、單點菜單 =====================

        function removeModule(id) {
            if (!canDefine()) return;
            const mod = modules.find(m => m.id === id);
            if (!mod) return;
            const uses = trays.reduce((s, t) => s + t.filter(p => p.type === 'module' && p.ref === id).length, 0);
            let msg = `確定要刪除套餐 ${id}「${mod.items.map(itemName).join('＋')}」嗎？`;
            if (uses > 0) msg += `\n\n托盤中的 ${uses} 個套餐 ${id} 也會一起移除。`;
            askConfirm(msg, () => {
                snapshot();
                modules = modules.filter(m => m.id !== id);
                trays = trays.map(t => t.filter(p => !(p.type === 'module' && p.ref === id)));
                updateAll();
                showMessage(`已刪除套餐 ${id}，按「↶ 復原」可以救回來`, 'info');
            });
        }

        function renderModules() {
            const list = document.getElementById('moduleList');
            document.getElementById('moduleCountText').innerText = (stage >= 3 ? '🔒 ' : '') + `${modules.length} / ${MAX_MODULES} 個`;
            list.innerHTML = '';

            modules.forEach(mod => {
                const row = document.createElement('div');
                row.className = 'mod-row relative w-full flex items-stretch bg-[#2a1a0d] border border-[#e27a3f] rounded-lg shadow-md shrink-0';

                const btn = document.createElement('button');
                btn.className = 'flex-1 min-w-0 flex items-center text-left p-1.5 rounded-lg transition-colors group ' + (canServe() ? 'hover:bg-[#e27a3f]' : 'cursor-default');
                btn.title = canServe() ? `呼叫套餐 ${mod.id}` : '';
                btn.onclick = () => callPiece('module', mod.id, btn);

                const idSpan = document.createElement('span');
                idSpan.className = 'text-[#ffb480] font-black text-2xl w-9 shrink-0 text-center transition-colors ' + (canServe() ? 'group-hover:text-white' : '');
                idSpan.textContent = mod.id;

                const itemsWrap = document.createElement('span');
                itemsWrap.className = 'border-l border-[#e27a3f]/50 pl-2 ml-1 flex-1 min-w-0 flex flex-wrap gap-1 transition-colors';
                itemsWrap.innerHTML = mod.items.map(it => `<span class="text-[1.2rem] whitespace-nowrap bg-black/40 text-gray-100 border border-gray-700 px-2 rounded">${esc(itemName(it))}</span>`).join('');

                btn.appendChild(idSpan);
                btn.appendChild(itemsWrap);
                row.appendChild(btn);

                if (canDefine()) {
                    const del = document.createElement('button');
                    del.className = 'seq-del';
                    del.textContent = '✕';
                    del.title = `刪除套餐 ${mod.id}`;
                    del.onclick = () => removeModule(mod.id);
                    row.appendChild(del);
                }
                list.appendChild(row);
            });

            // 螢幕上還空著的按鈕位置
            for (let k = modules.length; k < MAX_MODULES; k++) {
                const empty = document.createElement('div');
                empty.className = 'w-full border-2 border-dashed border-gray-800 rounded-lg text-gray-600 text-sm text-center py-2';
                empty.textContent = (k === 0 && canDefine()) ? '空的按鈕：在左側訂單按住滑鼠拖過餐點來建立' : '空的按鈕';
                list.appendChild(empty);
            }
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';
            MENU_CATEGORIES.forEach(cat => {
                const wrap = document.createElement('div');
                wrap.className = 'flex items-stretch bg-gray-900/30 rounded-lg border border-gray-800 p-1 gap-1';

                const title = document.createElement('div');
                title.className = 'w-10 shrink-0 flex items-center justify-center border-r border-gray-800 pr-1';
                title.innerHTML = `<div class="grid grid-cols-2 gap-y-0.5 text-[0.9rem] font-bold text-gray-400 leading-none text-center">${cat.title.split('').map(c => `<span>${c}</span>`).join('')}</div>`;
                wrap.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'flex-1 grid grid-cols-4 gap-1';
                cat.items.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = 'flex items-center justify-center px-1 py-1 rounded-lg border-2 text-[1.2rem] font-bold leading-tight whitespace-nowrap shadow-md transition-all select-none ' +
                        (canServe() ? 'bg-gray-800 border-gray-700 hover:bg-gray-600 hover:border-gray-400 text-gray-200 active:scale-95'
                                    : 'bg-gray-900 border-gray-800 text-gray-500 cursor-default');
                    btn.textContent = item.name;
                    btn.title = canServe() ? `單點 ${item.name}` : '';
                    btn.onclick = () => callPiece('item', item.id, btn);
                    grid.appendChild(btn);
                });
                wrap.appendChild(grid);
                container.appendChild(wrap);
            });
        }

        // ===================== 3. 右欄：出餐 =====================

        function selectOrder(i) {
            if (!canServe() || activeOrder === i) return;
            activeOrder = i;
            updateAll();
        }

        // 把套餐或單點放進目前選取那一單的托盤
        function callPiece(type, ref, btn) {
            if (!canServe()) { showMessage('這一關已經完成並鎖定，只能查看', 'info'); return; }
            if (activeOrder === null) {
                const next = nextIncomplete(orders.length - 1);
                if (next === null) {
                    showMessage(`${orders.length} 單都完成了！要修改請先點選右側某一單`, 'info');
                    return;
                }
                activeOrder = next;
            }
            if (btn) {
                btn.classList.add('animate-pop');
                setTimeout(() => btn.classList.remove('animate-pop'), 200);
            }

            snapshot();
            const i = activeOrder;
            trays[i].push({ type, ref });
            const st = orderStatus(i);
            // 點擊統計：點了之後這一單出現不對的餐點，就算錯誤點擊
            if (st === 'error') counts[stage].err++;
            else counts[stage].ok++;
            if (st === 'done') {
                activeOrder = nextIncomplete(i);
                showMessage(`第 ${orders[i].id} 單出餐正確！`, 'success');
            } else if (st === 'error') {
                showMessage(`第 ${orders[i].id} 單的餐點不對，請點 ✕ 移除`);
            }
            updateAll();
            scrollToActive();
        }

        function removeTrayPiece(i, j) {
            if (!canServe()) return;
            snapshot();
            trays[i].splice(j, 1);
            activeOrder = i;
            updateAll();
        }

        function clearOrder(i) {
            if (!canServe() || trays[i].length === 0) return;
            snapshot();
            trays[i] = [];
            activeOrder = i;
            updateAll();
            showMessage(`已清空第 ${orders[i].id} 單，按「↶ 復原」可以救回來`, 'info');
        }

        function scrollToActive() {
            if (activeOrder === null) return;
            const row = document.querySelector(`#trayList > [data-row="${activeOrder}"]`);
            if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        function renderTrays() {
            const list = document.getElementById('trayList');
            list.innerHTML = '';
            const serving = canServe();
            orders.forEach((o, i) => {
                const st = orderStatus(i);
                const active = serving && i === activeOrder;
                const row = document.createElement('div');
                row.dataset.row = i;
                row.className = 'flex items-center gap-2 px-1.5 py-1 rounded-lg border-2 transition-colors ' + (serving ? 'cursor-pointer ' : '') + (
                    active ? 'border-[#ffc72c] bg-yellow-900/20 shadow-[0_0_12px_rgba(255,199,44,0.2)]'
                    : st === 'done' ? 'border-green-700/70 bg-green-900/15'
                    : st === 'error' ? 'border-red-700 bg-red-900/20'
                    : 'border-gray-800 bg-gray-900/40' + (serving ? ' hover:border-gray-600' : ''));
                row.onclick = () => selectOrder(i);

                const num = document.createElement('div');
                num.className = `w-7 shrink-0 text-center text-xl leading-none ${active ? 'text-[#ffc72c] font-black' : 'text-gray-300 font-bold'}`;
                num.textContent = o.id;
                row.appendChild(num);

                const box = document.createElement('div');
                box.className = 'flex-1 min-w-0 flex flex-wrap items-center gap-1.5 py-1';
                if (trays[i].length === 0) {
                    box.innerHTML = active
                        ? `<span class="text-gray-400 text-sm">👈 ${hasModules() ? '點中間的套餐或單點' : '點中間的單點品項'}</span>`
                        : '<span class="text-gray-700 text-sm">—</span>';
                }
                // 第 1 關：正確的餐點亮綠框，不需要的餐點亮紅框
                const okJ = hasModules() ? null : matchSingles(o, trays[i]).okJ;
                trays[i].forEach((p, j) => {
                    const chip = document.createElement('span');
                    if (p.type === 'module') {
                        // 套餐：和左欄一樣，紅框包住它的餐點，左上角一個代號
                        const mod = modules.find(m => m.id === p.ref);
                        chip.className = 'tray-chip mod-group';
                        chip.innerHTML = `<span class="mod-badge">${esc(p.ref)}</span>` +
                            (mod ? mod.items.map(it => `<span class="chip cov">${esc(itemName(it))}</span>`).join('') : '');
                    } else {
                        // 單點：灰色實線框，沒有紅框
                        chip.className = 'tray-chip chip' + (okJ ? (okJ.has(j) ? ' got' : ' bad') : '');
                        chip.textContent = itemName(p.ref);
                    }
                    if (serving) {
                        const del = document.createElement('button');
                        del.className = 'seq-del';
                        del.textContent = '✕';
                        del.title = '從托盤移除';
                        del.onclick = (e) => { e.stopPropagation(); removeTrayPiece(i, j); };
                        chip.appendChild(del);
                    }
                    box.appendChild(chip);
                });
                row.appendChild(box);

                // 最右邊：完成顯示 ✅；托盤有東西但還沒完成時顯示 ✕，點一下清空這一單
                let mark;
                if (st === 'done') {
                    mark = document.createElement('div');
                    mark.textContent = '✅';
                } else if (serving && trays[i].length > 0) {
                    mark = document.createElement('button');
                    mark.textContent = '✕';
                    mark.title = `清空第 ${o.id} 單`;
                    mark.className = 'font-black rounded hover:bg-red-900/50 ' + (st === 'error' ? 'text-red-400 hover:text-red-300' : 'text-gray-500 hover:text-red-400');
                    mark.onclick = (e) => { e.stopPropagation(); clearOrder(i); };
                } else {
                    mark = document.createElement('div');
                }
                mark.classList.add('w-7', 'h-7', 'shrink-0', 'text-center', 'text-xl', 'leading-7');
                row.appendChild(mark);

                list.appendChild(row);
            });
        }

        // ===================== 統計與成績 (第 1、2 關) =====================

        function updateStats() {
            const total = orders.length;
            const statuses = orders.map((_, i) => orderStatus(i));
            const doneCount = statuses.filter(s => s === 'done').length;
            const errorOrders = orders.filter((_, i) => statuses[i] === 'error').map(o => o.id);
            const c = counts[stage];
            const clicks = c.ok + c.err;

            // 左下、中下資訊
            const totalItems = sumItems(orders);
            const cov = computeCoverage();
            const covered = cov.reduce((s, row) => s + row.filter(Boolean).length, 0);
            const big = (n) => `<b class="text-white text-xl">${n}</b>`;
            // 第 3 關的左下顯示套餐用得上的比例
            document.getElementById('info1').innerHTML = stage !== 3 ? ''
                : `<span>訂單 ${big(total)} 張・共 ${big(totalItems)} 個餐點</span><span class="text-gray-700">｜</span><span>套餐包含 ${big(Math.floor(covered / totalItems * 100))}%</span>`;

            // 右上：進度、錯誤、完成、點擊統計
            document.getElementById('okCount').innerText = c.ok;
            document.getElementById('errCount').innerText = c.err;
            document.getElementById('clickCount').innerText = clicks;
            const pct = Math.floor(doneCount / total * 100);
            const bar = document.getElementById('doneBar');
            bar.style.width = pct + '%';
            bar.className = 'h-full transition-all duration-300 ' + (doneCount === total ? 'bg-emerald-500' : 'bg-sky-500');
            document.getElementById('doneText').innerText = `${doneCount}/${total}`;

            const nextBtn = document.getElementById('nextBtn');
            nextBtn.classList.add('hidden');
            const compareBtn = document.getElementById('compareBtn');
            compareBtn.classList.add('hidden');
            let state = 'progress';
            if (errorOrders.length > 0) {
                state = 'error';
                document.getElementById('errorBox').innerText = `❌ 第 ${errorOrders.join('、')} 單有錯，請修正`;
            } else if (doneCount === total) {
                state = 'solved';
                if (isEditable()) stampNow();
                const big = (n) => `<span class="text-2xl text-red-600 mx-0.5 leading-none">${n}</span>`;
                document.getElementById('successBanner').innerHTML = clicks <= STAGES[stage].perfect
                    ? `🏆 完美！總點擊${big(clicks)}次`
                    : `✅ 全部完成！總點擊${big(clicks)}次`;
                if (isEditable()) {
                    nextBtn.textContent = `進入第 ${stage + 1} 關 ▶`;
                    nextBtn.classList.remove('hidden');
                }
                // 第 2 關完成：和第 1 關比一比 (第一次完成時自動跳出)
                if (stage === 2) {
                    compareBtn.classList.remove('hidden');
                    if (!compareShown) {
                        compareShown = true;
                        setTimeout(showCompare, 900);
                    }
                }
            }
            document.getElementById('progressLine').classList.toggle('hidden', state !== 'progress');
            document.getElementById('errorBox').classList.toggle('hidden', state !== 'error');
            document.getElementById('successBanner').classList.toggle('hidden', state !== 'solved');

            // 分數變高時上傳到老師的試算表
            const pts = stagePoints(stage);
            if (isEditable() && pts > synced[stage]) {
                synced[stage] = pts;
                syncScores();
            }

            renderScoreboard();
        }

        // ---------- 第 2 關完成：和第 1 關比較點擊次數 ----------
        let compareShown = false;

        function showCompare() {
            const a = counts[1], b = counts[2];
            const ta = a.ok + a.err, tb = b.ok + b.err;
            const saved = ta - tb;
            const pct = ta > 0 ? Math.round(saved / ta * 100) : 0;
            const row = (label, x, y, color) => `<tr><td class="text-left font-bold text-gray-300">${label}</td><td class="${color}">${x} 次</td><td class="${color}">${y} 次</td></tr>`;
            document.getElementById('compareBody').innerHTML = `
                <table class="concept-table w-full text-xl text-center">
                    <thead><tr><th></th><th>第 1 關（單點）</th><th>第 2 關（套餐）</th></tr></thead>
                    <tbody class="font-black">
                        ${row('成功點擊', a.ok, b.ok, 'text-emerald-400')}
                        ${row('錯誤點擊', a.err, b.err, 'text-red-400')}
                        ${row('總點擊', ta, tb, 'text-[#ffc72c] text-2xl')}
                    </tbody>
                </table>
                <div class="mt-4 text-center text-2xl font-black ${saved > 0 ? 'text-[#8bc576]' : 'text-gray-300'}">
                    ${saved > 0 ? `用套餐少點了 <span class="text-[#ffc72c] text-4xl">${saved}</span> 次，省下 <span class="text-[#ffc72c] text-4xl">${pct}%</span>！` : '這次沒有比較少，再想想哪些餐點常常一起出現？'}
                </div>
                <div class="mt-3 text-center text-gray-400">→ 把重複出現的步驟包成<b class="text-white">模組</b>，就能少做很多重複的事</div>`;
            const modal = document.getElementById('compareModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function hideCompare() {
            const modal = document.getElementById('compareModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // ---------- 計分 (即時) ----------
        // 第 1 關：每完成一單 1 分 (滿分 15)
        // 第 2 關：每完成一單，單點完成 1 分、有用套餐完成 3 分 (第 7 單用不到套餐，單點也給 3 分；滿分 45)
        // 第 3 關：每完成一單 2 分 (滿分 20)
        // 第 4 關：答對 1 題 7 分、2 題 14 分、全對 20 分
        const STAGE_MAX = { 1: 15, 2: 45, 3: 20, 4: 20 };
        const synced = { 1: 0, 2: 0, 3: 0 };   // 已上傳的最高分

        // 取得某一關的訂單、托盤、套餐 (目前顯示的關卡用畫面上的資料)
        function stageView(s) {
            if (unlocked < s) return null;
            if (s === stage) return { orders, trays, modules };
            const d = stageData[s];
            if (!d) return null;
            // 第 3 關的套餐沿用第 2 關 (第 2 關正在畫面上時用畫面上的套餐)
            const mods = s === 3 ? (stage === 2 ? modules : stageData[2].modules) : d.modules;
            return { orders: STAGES[s].orders, trays: d.trays, modules: mods };
        }

        // 某一單的得分
        function orderPoints(s, order, tray, mods) {
            if (statusOf(order, tray, mods) !== 'done') return 0;
            if (s === 1) return 1;
            if (s === 2) return (order.fullWithoutModule || tray.some(p => p.type === 'module')) ? 3 : 1;
            return 2;
        }

        function stagePoints(s) {
            if (s === QUIZ_STAGE) return best[4] === null ? 0 : QUIZ_SCORES[best[4]];
            const v = stageView(s);
            if (!v) return 0;
            return v.orders.reduce((sum, o, i) => sum + orderPoints(s, o, v.trays[i], v.modules), 0);
        }

        function stageDoneCount(s) {
            const v = stageView(s);
            if (!v) return 0;
            return v.orders.filter((o, i) => statusOf(o, v.trays[i], v.modules) === 'done').length;
        }

        function renderScoreboard() {
            let total = 0;
            // 目前這一關已經完成、還沒進入下一關：下一關的按鈕閃爍綠色，提示學生點擊
            // 找第一個「已完成、還沒按進入下一關」的關卡，下一關閃爍
            let readyNext = null;
            for (let k = 1; k < QUIZ_STAGE; k++) {
                if (k <= unlocked && !closed[k] && isStageSolved(k)) { readyNext = k + 1; break; }
            }
            let html = '<span class="text-gray-400 text-[1.3125rem] font-bold shrink-0 mr-1">🏆 關卡</span>';
            [1, 2, 3, 4].forEach(s => {
                const pts = stagePoints(s);
                const max = STAGE_MAX[s];
                total += pts;
                const ring = s === stage ? ' ring-2 ring-orange-500 ring-offset-1 ring-offset-black' : '';
                let cls, status, onclick = `viewStage(${s})`;
                if (s === readyNext) {
                    cls = 'bg-green-600 border-green-300 text-white hover:bg-green-500 animate-pulse shadow-[0_0_16px_rgba(34,197,94,0.9)]';
                    status = '▶ 點我進入';
                    onclick = `goNext(${s})`;
                } else if (s < QUIZ_STAGE && unlocked < s) {
                    cls = 'bg-gray-900 border-gray-700 text-gray-500 hover:bg-gray-800';
                    status = `🔒 先完成第 ${s - 1} 關`;
                } else {
                    if (s === QUIZ_STAGE) status = best[4] === null ? '未作答' : `答對 ${best[4]}/${QUIZ_ROWS.length} 題`;
                    else status = `完成 ${stageDoneCount(s)}/${STAGES[s].orders.length}・成功 ${counts[s].ok}`;
                    cls = pts >= max ? 'bg-yellow-500 border-yellow-300 text-black hover:bg-yellow-400'
                        : pts > 0 ? 'bg-yellow-500/15 border-yellow-500 text-yellow-300 hover:bg-yellow-500/25'
                        : 'bg-gray-800/60 border-gray-700 text-gray-400 hover:bg-gray-700';
                }
                const ptsColor = s === readyNext ? 'text-yellow-200' : pts >= max ? 'text-red-600' : 'text-red-500';
                html += `<button onclick="${onclick}" class="border-2 rounded-lg px-3 py-1 text-[1.05rem] leading-tight text-center transition-colors whitespace-nowrap ${cls}${ring}"><span class="block font-bold">${s}. ${STAGES[s].name}<span class="${ptsColor} ml-1">${pts}/${max}分</span></span><span class="block text-[0.9rem]">${status}</span></button>`;
            });
            html += `<span class="shrink-0 ml-1 text-red-500 font-black text-[1.6875rem]">總分 ${total} 分</span>`;
            html += `<span class="ml-auto text-[1.125rem] text-gray-500 shrink-0">${lastSolvedStamp}</span>`;
            document.getElementById('scoreboard').innerHTML = html;
        }

        // 某一關是否已經全部完成
        function isStageSolved(s) {
            const v = stageView(s);
            return !!v && v.orders.every((o, i) => statusOf(o, v.trays[i], v.modules) === 'done');
        }

        // 點閃爍的下一關按鈕：回到剛完成的那一關，再進入下一關
        function goNext(target) {
            if (stage !== target - 1) viewStage(target - 1);
            advance();
        }

        // ===================== 第 3 關：概念對照 (拖曳作答) =====================

        const optionOf = (id) => QUIZ_OPTIONS.find(o => o.id === id) || {};
        const optionChip = (id) => `<span class="quiz-chip" data-opt="${id}"><img src="${optionOf(id).img}" alt="${esc(optionOf(id).text)}" draggable="false"></span>`;

        function renderQuiz() {
            // 對照表：Scratch 欄是放截圖的格子
            const done = quiz.submitted;
            const rows = QUIZ_ROWS.map((row, i) => {
                const opt = quiz.slots[i];
                let cell = opt ? optionChip(opt) : '<span class="text-gray-600 text-xl">拖到這裡</span>';
                let cellCls = 'drop-cell';
                if (done) {
                    const ok = opt === row.answer;
                    cellCls += ok ? ' !border-solid !border-emerald-500 bg-emerald-900/30' : ' !border-solid !border-red-500 bg-red-900/30';
                    cell += ok ? '<span class="text-3xl">✅</span>'
                               : `<span class="text-3xl">❌</span><span class="flex flex-col items-center gap-1 text-emerald-300 font-bold text-xl">正確答案<span class="answer-thumb"><img src="${optionOf(row.answer).img}" alt="${esc(optionOf(row.answer).text)}"></span></span>`;
                }
                return `<tr><td class="font-bold text-white text-xl w-[22%]">${row.food}</td><td class="text-xl w-[22%]">${row.prog}</td><td><div class="${cellCls}" data-slot="${i}">${cell}</div></td></tr>`;
            }).join('');

            // 選項區：還沒放進表格的選項
            const pool = quiz.order.filter(id => !quiz.slots.includes(id));
            const filled = quiz.slots.every(Boolean);
            const correct = QUIZ_ROWS.filter((row, i) => quiz.slots[i] === row.answer).length;

            const table = `
                <table class="concept-table w-full text-xl text-center">
                    <thead><tr><th>點餐大師</th><th>程式設計</th><th>Scratch</th></tr></thead>
                    <tbody class="text-gray-100">${rows}</tbody>
                </table>`;

            // 作答中：表格在左、積木圖在右，一個畫面就能拖完；送出後：表格加上成績
            document.getElementById('quizArea').innerHTML = done ? `
                <div class="quiz-locked flex flex-col gap-4">
                    ${table}
                    <div class="text-center text-2xl font-black bg-[#e8c338] text-black rounded-xl py-3 shadow-[0_0_20px_rgba(232,195,56,0.5)]">
                        答對 <span class="text-red-600 text-3xl">${correct}</span> / ${QUIZ_ROWS.length} 題，得 <span class="text-red-600 text-3xl">${QUIZ_SCORES[correct]}</span> 分
                    </div>
                </div>` : `
                <div class="flex gap-4 items-start">
                    <div class="flex-1 min-w-0">${table}</div>
                    <div class="w-[260px] shrink-0 flex flex-col gap-3">
                        <div class="text-sky-300 font-bold text-xl">🧩 Scratch 積木圖<br><span class="text-gray-400 font-normal text-xl">拖到左邊表格的 Scratch 欄</span></div>
                        <div id="quizPool" class="min-h-[134px] flex flex-col items-center justify-center gap-4 p-3 bg-[#111827] border-2 border-dashed border-sky-900 rounded-xl">
                            ${pool.length ? pool.map(optionChip).join('') : '<span class="text-gray-600 text-center text-xl">（積木圖都放進表格了，可以拖回這裡）</span>'}
                        </div>
                        <button onclick="submitQuiz()" ${filled ? '' : 'disabled'} class="bg-[#759e66] hover:bg-[#5a7d4e] disabled:bg-gray-700 disabled:text-gray-400 disabled:cursor-not-allowed text-white text-xl font-black py-2 rounded-full shadow-lg">送出答案</button>
                        ${filled ? '' : `<div class="text-gray-500 text-sm text-center -mt-2">${QUIZ_ROWS.length} 個格子都放好積木圖後才能送出</div>`}
                    </div>
                </div>`;
        }

        // ---------- 拖曳選項 ----------
        let qdrag = null;   // { opt, from (格子編號或 null=選項區), ghost, src }

        function quizDown(e) {
            if (stage !== QUIZ_STAGE || quiz.submitted) return;
            if (e.button !== undefined && e.button !== 0) return;
            const chip = e.target.closest('[data-opt]');
            if (!chip) return;
            e.preventDefault();
            const from = chip.closest('[data-slot]');
            const ghost = chip.cloneNode(true);
            ghost.classList.add('quiz-ghost');
            ghost.style.left = e.clientX + 'px';
            ghost.style.top = e.clientY + 'px';
            document.body.appendChild(ghost);
            chip.style.opacity = '0.3';
            qdrag = { opt: chip.dataset.opt, from: from ? Number(from.dataset.slot) : null, ghost, src: chip };
        }

        function dropTarget(e) {
            const el = document.elementFromPoint(e.clientX, e.clientY);
            if (!el) return {};
            return { slot: el.closest('[data-slot]'), pool: el.closest('#quizPool') };
        }

        function quizMove(e) {
            if (!qdrag) return;
            e.preventDefault();
            qdrag.ghost.style.left = e.clientX + 'px';
            qdrag.ghost.style.top = e.clientY + 'px';
            document.querySelectorAll('.drop-hover').forEach(el => el.classList.remove('drop-hover'));
            const { slot, pool } = dropTarget(e);
            if (slot) slot.classList.add('drop-hover');
            else if (pool) pool.classList.add('drop-hover');
        }

        function quizCancel() {
            if (!qdrag) return;
            qdrag.ghost.remove();
            qdrag.src.style.opacity = '';
            qdrag = null;
            document.querySelectorAll('.drop-hover').forEach(el => el.classList.remove('drop-hover'));
        }

        function quizUp(e) {
            if (!qdrag) return;
            const { slot, pool } = dropTarget(e);
            const { opt, from } = qdrag;
            quizCancel();
            if (slot) {
                const to = Number(slot.dataset.slot);
                const prev = quiz.slots[to];
                quiz.slots[to] = opt;
                // 從另一個格子拖過來：兩格交換；從選項區拖過來：原本的選項回到選項區
                if (from !== null && from !== to) quiz.slots[from] = prev;
            } else if (pool && from !== null) {
                quiz.slots[from] = null;   // 拖回選項區
            }
            renderQuiz();
        }

        function submitQuiz() {
            if (quiz.submitted || !quiz.slots.every(Boolean)) return;
            askConfirm('送出後就不能修改答案，確定要送出嗎？', () => {
                quiz.submitted = true;
                best[4] = QUIZ_ROWS.filter((row, i) => quiz.slots[i] === row.answer).length;
                stampNow();
                syncScores();
                renderQuiz();
                renderScoreboard();
            }, '送出答案', 'bg-[#759e66] hover:bg-[#5a7d4e]');
        }

        // ===================== 上傳成績到老師的試算表 =====================
        // 只有透過 Google Apps Script 網頁應用程式開啟時才會上傳；
        // 直接開啟 HTML 檔 (或放在 GitHub) 時不會上傳，其他功能照常。

        const hasServer = typeof google !== 'undefined' && !!google.script && !!google.script.run;
        let userEmail = '';

        function setSyncStatus(text, color) {
            const el = document.getElementById('syncStatus');
            el.textContent = text;
            el.className = color || 'text-gray-400';
        }

        function initAccount() {
            if (!hasServer) return;
            document.getElementById('accountInfo').classList.remove('hidden');
            setSyncStatus('讀取帳號中…');
            google.script.run
                .withSuccessHandler(email => {
                    userEmail = email;
                    if (email) {
                        document.getElementById('accountEmail').textContent = '👤 ' + email;
                        setSyncStatus('完成每一關後，成績會自動上傳');
                    } else {
                        document.getElementById('accountEmail').textContent = '⚠️ 未取得學校帳號';
                        setSyncStatus('成績不會上傳，請改用學校帳號登入', 'text-amber-400');
                    }
                })
                .withFailureHandler(() => setSyncStatus('⚠️ 無法連線，成績不會上傳', 'text-amber-400'))
                .getUserEmail();
        }

        function syncScores() {
            if (!hasServer || !userEmail) return;
            setSyncStatus('☁️ 成績上傳中…', 'text-sky-300');
            google.script.run
                .withSuccessHandler(() => setSyncStatus('☁️ 成績已上傳', 'text-emerald-400'))
                .withFailureHandler(err => {
                    setSyncStatus('⚠️ 上傳失敗，下次完成時會再試', 'text-red-400');
                    showMessage('成績上傳失敗：' + (err && err.message ? err.message : '請檢查網路'));
                })
                .saveScores({ s1: stagePoints(1), s2: stagePoints(2), s3: stagePoints(3), s4: best[4],
                              c1: counts[1].ok + counts[1].err, c2: counts[2].ok + counts[2].err });
        }
    </script>
</body>
</html>
